services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orquesta
      POSTGRES_PASSWORD: orquesta
      POSTGRES_DB: orquesta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquesta"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ORQUESTA_DATABASE_URL: postgresql+asyncpg://orquesta:orquesta@db:5432/orquesta
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ORQUESTA_ADMIN_TOKEN: ${ORQUESTA_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

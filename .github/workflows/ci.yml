name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t orquesta .
      - name: Probar que arranca
        run: |
          docker run -d --name orquesta -p 8000:8000 orquesta
          for i in $(seq 1 20); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs orquesta
          exit 1
